apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-service
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-service
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  ports:
    - name: proxy-port
      protocol: TCP
      port: {{ .Values.server.port }}
      targetPort: proxy-port
      nodePort: {{ .Values.server.outwardPort }}
