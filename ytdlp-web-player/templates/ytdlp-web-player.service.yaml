apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-service
spec:
  selector:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  ports:
    - protocol: TCP
      port: 80
      # By name, so the container port is configured in exactly one place
      # (ytdlpWebPlayer.ports).
      targetPort: http
      name: http
  type: ClusterIP
