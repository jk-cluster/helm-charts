apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
spec:
  replicas: {{ include "apache-tika.replicas" (dict "scaleDown" .Values.scaleDown "replicas" .Values.tika.replicas) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  template:
    metadata:
      name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.tika.securityContext.pod | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
          image: "apache/tika:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          {{- if .Values.tika.env }}
          env:
            {{- range $value := .Values.tika.env }}
            {{- if $value.value }}
            - name: {{ $value.name | quote }}
              value: {{ tpl $value.value $ | quote }}
            {{- else if $value.valueFrom }}
            {{- if $value.valueFrom.secretKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $value.valueFrom.secretKeyRef.name $ | quote }}
                  key: {{ tpl $value.valueFrom.secretKeyRef.key $ | quote }}
            {{- else if $value.valueFrom.configMapKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ tpl $value.valueFrom.configMapKeyRef.name $ | quote }}
                  key: {{ tpl $value.valueFrom.configMapKeyRef.key $ | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.tika.securityContext.container | nindent 12 }}
          volumeMounts:
            # Tika writes temporary files during parsing; with a read-only
            # root filesystem /tmp must be a writable emptyDir.
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 9998
              protocol: TCP
              name: tika-port
          livenessProbe:
            {{- toYaml .Values.tika.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.tika.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.tika.startupProbe | nindent 12 }}
          resources:
            {{- include "apache-tika.resources" .Values.tika.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
