apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
spec:
  replicas: {{ include "xxx.replicas" (dict "scaleDown" .Values.scaleDown "replicas" .Values.xxx.replicas) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  template:
    metadata:
      name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
      annotations:
        # Hash of the rendered ConfigMap: a changed ConfigMap changes the pod
        # template and thus rolls the pods. Without it a config change stays
        # invisible to the running container - subPath mounts are never
        # updated by the kubelet, and most apps read their config only at
        # start. Add one line per ConfigMap the workload consumes.
        checksum/config: {{ include (print $.Template.BasePath "/xxx.configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "xxx.podSecurityContext" .Values.xxx.securityContext | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
          # Fully qualified on purpose: an unqualified "registry/image" resolves
          # to Docker Hub, which is how the repo accumulated its unqualified
          # images. Replace host/org/image, keep the registry host.
          image: "ghcr.io/ORG/IMAGE:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          env:
            {{- range $value := .Values.xxx.env }}
            {{- if $value.value }}
            - name: {{ $value.name | quote }}
              # quote is required, not cosmetic: a value like "8080" or "true"
              # renders unquoted as a YAML number/bool, and the API server then
              # rejects the whole manifest with "cannot unmarshal number into
              # Go struct field EnvVar.value of type string". Every chart in
              # this repo quotes here.
              value: {{ tpl $value.value $ | quote }}
            {{- else if $value.valueFrom }}
            {{- if $value.valueFrom.secretKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $value.valueFrom.secretKeyRef.name $ | quote }}
                  key: {{ tpl $value.valueFrom.secretKeyRef.key $ | quote }}
            {{- else if $value.valueFrom.configMapKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ tpl $value.valueFrom.configMapKeyRef.name $ | quote }}
                  key: {{ tpl $value.valueFrom.configMapKeyRef.key $ | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            {{- toYaml .Values.xxx.ports | nindent 12 }}
          # Probes, resources and both security contexts go through the
          # null-safe helpers (#99): an erased block means "chart defaults
          # apply" instead of a vanished probe or an unhardened container.
          # Never wrap these in an "if" - a guard hides the erased case
          # completely instead of rendering a visible null.
          livenessProbe:
            {{- include "xxx.livenessProbe" .Values.xxx.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- include "xxx.readinessProbe" .Values.xxx.readinessProbe | nindent 12 }}
          startupProbe:
            {{- include "xxx.startupProbe" .Values.xxx.startupProbe | nindent 12 }}
          resources:
            {{- include "xxx.effectiveResources" .Values.xxx.resources | nindent 12 }}
          securityContext:
            {{- include "xxx.containerSecurityContext" .Values.xxx.securityContext | nindent 12 }}
      restartPolicy: Always
