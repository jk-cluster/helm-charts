apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-sfs
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-sfs
spec:
  replicas: {{ include "samba.replicas" (dict "scaleDown" .Values.scaleDown "replicas" .Values.samba.replicas) }}
  serviceName: {{ .Release.Name }}-{{ .Chart.Name }}-service
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}-sfs
  template:
    metadata:
      name: {{ .Release.Name }}-{{ .Chart.Name }}-sfs
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-sfs
      annotations:
        # Hash of the rendered ConfigMap: a changed smb.conf (i.e. a changed
        # samba.shares list) changes the pod template and thus restarts the
        # pod. Without it a new or renamed share never reaches the running
        # smbd - smb.conf is mounted with subPath (never refreshed by the
        # kubelet) and is read once at start.
        # users.conf is NOT covered: it comes from a 1Password-backed Secret
        # whose content Helm never sees. See secrets.sambaUsersSecretRef in
        # values.yaml.
        checksum/config: {{ include (print $.Template.BasePath "/samba-config.configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}-sfs
          image: "ghcr.io/dockur/samba:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          {{- with .Values.samba.env }}
          env:
            {{- range $value := . }}
            {{- if $value.value }}
            - name: {{ $value.name }}
              value: {{ tpl $value.value $ | quote }}
            {{- else if $value.valueFrom }}
            {{- if $value.valueFrom.secretKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $value.valueFrom.secretKeyRef.name $ | quote }}
                  key: {{ tpl $value.valueFrom.secretKeyRef.key $ | quote }}
            {{- else if $value.valueFrom.configMapKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ tpl $value.valueFrom.configMapKeyRef.name $ | quote }}
                  key: {{ tpl $value.valueFrom.configMapKeyRef.key $ | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: 445
              protocol: TCP
            - containerPort: 139
              protocol: TCP
          volumeMounts:
            - name: smb-config
              mountPath: "/etc/samba/smb.conf"
              readOnly: true
              subPath: smb.conf
            - name: smb-users
              mountPath: "/etc/samba/users.conf"
              readOnly: true
              subPath: users.conf
            {{- range $index, $value := .Values.samba.shares }}

            - name: "{{ $value.name }}"
              mountPath: "/shares/{{ $value.name }}"
            {{- end }}
          livenessProbe:
            {{- include "samba.livenessProbe" .Values.samba.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- include "samba.readinessProbe" .Values.samba.readinessProbe | nindent 12 }}
          startupProbe:
            {{- include "samba.startupProbe" .Values.samba.startupProbe | nindent 12 }}
          resources:
            {{- include "samba.effectiveResources" .Values.samba.resources | nindent 12 }}
          securityContext:
            {{- include "samba.containerSecurityContext" .Values.samba.securityContext | nindent 12 }}
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        {{- include "samba.podSecurityContext" .Values.samba.securityContext | nindent 8 }}
      volumes:
        - name: smb-config
          configMap:
            name: {{ .Release.Name }}-{{ .Chart.Name }}-configmap
            items:
              - key: smb.conf
                path: smb.conf
        - name: smb-users
          secret:
            secretName: {{ .Release.Name }}-{{ .Chart.Name }}-users-secret
            items:
              - key: users.conf
                path: users.conf
        {{- range $index, $value := .Values.samba.shares }}

        - name: "{{ $value.name }}"
          persistentVolumeClaim:
            claimName: "{{ $.Release.Name }}-{{ $value.name }}-volume-claim"
        {{- end }}
