apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
spec:
  replicas: {{ include "cyberchef.replicas" (dict "scaleDown" .Values.scaleDown "replicas" .Values.cyberchef.replicas) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  template:
    metadata:
      name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.cyberchef.securityContext.pod | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
          image: "ghcr.io/gchq/cyberchef:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.cyberchef.securityContext.container | nindent 12 }}
          volumeMounts:
            # nginx needs writable cache/temp dirs and a writable pid file
            # location when the root filesystem is read-only.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
          ports:
            - containerPort: 80
              protocol: TCP
              name: http
          livenessProbe:
            {{- toYaml .Values.cyberchef.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.cyberchef.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.cyberchef.startupProbe | nindent 12 }}
          resources:
            {{- include "cyberchef.resources" .Values.cyberchef.resources | nindent 12 }}
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      restartPolicy: Always
