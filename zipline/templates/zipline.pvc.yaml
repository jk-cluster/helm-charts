apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Documented exception from the "-<kind>" naming scheme (issue #32): renaming
  # a PVC would provision a new, empty volume, so the historic "-vc" name stays.
  name: {{ .Release.Name }}-{{ .Chart.Name }}-vc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ required "A storage-amount must be provided" .Values.config.storage }}
  storageClassName: {{ required "A storage-class must be provided" .Values.config.storageClass }}
