{{- if .Values.secrets.valkeySecretRef }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-valkey-secret
spec:
  # Optional, and only meaningful with settings.limiter: true. The item must
  # carry a "valkey-url" field pointing at an EXTERNAL Valkey/Redis; the chart
  # deploys none of its own, because charts in this repo have no dependencies.
  itemPath: {{ .Values.secrets.valkeySecretRef }}
{{- end }}
