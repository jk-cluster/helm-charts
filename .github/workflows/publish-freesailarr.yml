name: Publish Freesailarr Helm Chart
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - freesailarr/**
jobs:
  publish-freesailarr:
    name: Publish Freesailarr Helm Chart
    uses: ./.github/workflows/publish-helm-chart.yml
    with:
      chart-name: 'freesailarr'
    secrets: inherit
