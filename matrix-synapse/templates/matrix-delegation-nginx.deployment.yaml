{{- if .Values.matrix.delegation.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-delegation-nginx
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-delegation-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}-delegation-nginx
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-delegation-nginx
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}-delegation-nginx
          image: "nginx:1.28.3"
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            limits:
              memory: "{{ .Values.matrix.delegation.resources.limits.memory }}"
              cpu: "{{ .Values.matrix.delegation.resources.limits.cpu }}"
              ephemeral-storage: "{{ .Values.matrix.delegation.resources.limits.ephemeralStorage }}"
            requests:
              memory: "{{ .Values.matrix.delegation.resources.requests.memory }}"
              cpu: "{{ .Values.matrix.delegation.resources.requests.cpu }}"
              ephemeral-storage: "{{ .Values.matrix.delegation.resources.requests.ephemeralStorage }}"
          readinessProbe:
            httpGet:
              path: /.well-known/matrix/server
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /.well-known/matrix/server
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # The startup probe gates liveness/readiness. Startup budget = 5s * 30 = 150s.
          startupProbe:
            httpGet:
              path: /.well-known/matrix/server
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-{{ .Chart.Name }}-delegation-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
{{- end }}