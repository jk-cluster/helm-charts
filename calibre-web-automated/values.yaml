secrets:
  cwaSecretRef: null

cwa:
  storage: 10Gi
  storageClass: longhorn
  timezone: "UTC"
  maxUploadFileSize: "10m"
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # The startup probe gates liveness/readiness. Startup budget = 10s * 30 = 300s.
  startupProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  resources:
    requests:
      cpu: 0.1
      memory: 512Mi
      ephemeralStorage: 100Mi
    limits:
      cpu: 1
      memory: 1024Mi
      ephemeralStorage: 200Mi

ingress:
  clusterIssuer: "letsencrypt-issuer"
  domain: null