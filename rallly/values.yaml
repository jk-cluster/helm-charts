secrets:
  ralllySecretRef: null
  oidcSecretRef: null
  databaseSecretRef: null
  smtpSecretRef: null

rallly:
  smtp:
    enabled: false
  allowedEmails: '*'
  supportEmail: null
  oidc:
    name: 'OIDC'
    pictureClaimPath: 'picture'
    emailClaimPath: 'email'
    nameClaimPath: 'name'
  resources:
    # Limits are optional: memory and ephemeral-storage limits default to
    # limitFactor x the request, an explicitly set limit always wins, and a
    # CPU limit is only set when configured explicitly under "limits".
    limitFactor: 3
    requests:
      cpu: 0.1
      memory: 512Mi
      ephemeral-storage: 100Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # The startup probe gates liveness/readiness, so those need no initialDelaySeconds.
  # Startup budget = periodSeconds * failureThreshold = 150s.
  startupProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30

ingress:
  clusterIssuer: null
  domain: null