apiVersion: v2
name: freesailarr
description: A Helm chart to deploy a Wireguard-tunneled media automation stack (gluetun, qbittorrent, the *arrs, seerr) on Kubernetes
icon: https://raw.githubusercontent.com/qdm12/gluetun/master/doc/logo_256.png

type: application

version: 1.0.0+upv3.41.1
# Hand-maintained marker for the gluetun line this chart is built around - it
# is NOT the source of any image tag. All nine images, gluetun included, are
# pinned in values.yaml so Renovate's helm-values manager can propose them
# there; consequently this chart has no app-version block in renovate.json5 and
# nothing rewrites this field automatically. Update it by hand together with
# gluetun.image.tag, otherwise the +up suffix of version: stops describing what
# the chart deploys.
appVersion: "v3.41.1"

maintainers:
  - name: jklein
