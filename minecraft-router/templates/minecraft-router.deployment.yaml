apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  labels:
    app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
spec:
  replicas: {{ include "minecraft-router.replicas" (dict "scaleDown" .Values.scaleDown "replicas" .Values.server.replicas) }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
  template:
    metadata:
      name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
      annotations:
        # Rolls the pod whenever the rendered routing ConfigMap changes.
        # Without it a changed routing table stays inert: the file is mounted
        # with subPath (kubelet never refreshes those in a running container)
        # and mc-router reads ROUTES_CONFIG only at startup, so the router
        # would keep serving the old routes while everything looks healthy.
        checksum/config: {{ include (print $.Template.BasePath "/minecraft-router.configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "minecraft-router.podSecurityContext" .Values.server.securityContext | nindent 8 }}
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}-deployment
          image: "itzg/mc-router:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          args:
            - "--port"
            - "{{ .Values.server.port }}"
            - "--api-binding"
            - ":{{ .Values.server.apiPort }}"
          env:
            - name: ROUTES_CONFIG
              value: /data/custom-routing-config.json
            {{- range $value := .Values.server.env }}
            {{- if $value.value }}
            - name: {{ $value.name }}
              value: {{ tpl $value.value $ }}
            {{- else if $value.valueFrom }}
            {{- if $value.valueFrom.secretKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $value.valueFrom.secretKeyRef.name $ }}
                  key: {{ tpl $value.valueFrom.secretKeyRef.key $ }}
            {{- else if $value.valueFrom.configMapKeyRef }}
            - name: {{ $value.name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ tpl $value.valueFrom.configMapKeyRef.name $ }}
                  key: {{ tpl $value.valueFrom.configMapKeyRef.key $ }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: proxy-port
              protocol: TCP
              containerPort: {{ .Values.server.port }}
            - name: api-port
              protocol: TCP
              containerPort: {{ .Values.server.apiPort }}
          livenessProbe:
            {{- include "minecraft-router.livenessProbe" .Values.server.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- include "minecraft-router.readinessProbe" .Values.server.readinessProbe | nindent 12 }}
          startupProbe:
            {{- include "minecraft-router.startupProbe" .Values.server.startupProbe | nindent 12 }}
          resources:
            {{- include "minecraft-router.effectiveResources" .Values.server.resources | nindent 12 }}
          securityContext:
            {{- include "minecraft-router.containerSecurityContext" .Values.server.securityContext | nindent 12 }}
          volumeMounts:
            - name: config-mount
              mountPath: /data/custom-routing-config.json
              subPath: custom-routing-config.json
              readOnly: true
      volumes:
        - name: config-mount
          configMap:
            name: {{ .Release.Name }}-{{ .Chart.Name }}-configmap
      restartPolicy: Always
